  BACKUP_COLS.forEach(c=>{ out[c]=state[c].map(({id,...rest})=>({id,...rest})); });
  return out;
}
async function importBackup(obj){
  if(!obj || obj.app!=='onkovet') throw new Error('arquivo não é um backup do ONKOVET');
  if(!(await askConfirm('Importar o backup? Registros com o mesmo código serão substituídos; nada é apagado.','Importar'))) return;
  let n=0;
  for(const c of BACKUP_COLS) for(const {id,...rest} of (obj[c]||[])){ await dbSet(c+'/'+id, rest); n++; }
  if(obj.clinic && Object.keys(obj.clinic).length) await dbSet('settings/clinic', obj.clinic);
  toast(n+' registro(s) importado(s)');
}
function wireAdmin(){
  const note=document.getElementById('bk-note'), ta=document.getElementById('bk-text');
  const ex=document.getElementById('bk-export');
  if(ex) ex.addEventListener('click', async ()=>{
    const json=JSON.stringify(buildBackup(),null,1);
    const dl=await getDownloader();
    try{ if(!dl) throw 0; await dl.save({filename:`onkovet-backup-${todayStr()}.json`, data:new Blob([json],{type:'application/json'})}); toast('Backup salvo'); }
    catch(e){ ta.style.display='block'; ta.value=json; ta.select(); note.textContent='Não foi possível baixar aqui. Copie o texto acima e salve em um arquivo .json.'; }
  });
  const fi=document.getElementById('bk-file');
  if(fi) fi.addEventListener('change', async ()=>{
    const f=fi.files[0]; if(!f) return;
    try{ await importBackup(JSON.parse(await f.text())); }catch(e){ toast('Erro: '+e.message); }
  });
  if(typeof wireTeam==='function') wireTeam();
}

  const first=sess.find(x=>x.type!=='retorno'); const startRef=p.protocolStartDate||(first&&first.plannedDate);
  const runs=runsOf(p), th=state.therapies.filter(t=>t.patientId===p.id), ex=examRequestsOf(p.id);
  const row=(k,v)=>`<tr><td style="width:150px"><b>${e(k)}</b></td><td>${e(v)}</td></tr>`;
  let h=`<h1>Histórico do paciente — ONKOVET</h1><p style="color:#666;font-size:10pt">${e(c.clinicName?c.clinicName+' · ':'')}${e(c.vetName||DEFAULT_VET)}${c.crmv?' · CRMV '+e(c.crmv):''} · Emitido em ${e(new Date().toLocaleString('pt-BR'))}</p>
  <h2>Identificação</h2><table>${row('Paciente',p.name)}${row('Espécie / raça',(SPECIES_LABEL[p.species]||'')+' · '+(p.breed||'SRD'))}${row('Sexo / idade',[p.sex,p.age].filter(Boolean).join(' · ')||'—')}${row('Tutor',p.tutor||'—')}${row('Microchip',p.microchip||'—')}${row('Peso atual',p.weight?p.weight+' kg':'—')}${row('Diagnóstico',p.diagnosis||'—')}${row('Situação',st.t+(p.outcomeDate?' em '+fmtDateBR(p.outcomeDate):'')+(p.outcomeNotes?' — '+p.outcomeNotes:''))}${startRef?row('Início / acompanhamento',fmtDateBR(startRef)+' · '+diffDays(startRef,p.outcomeDate||todayStr())+' dias'):''}</table>`;
  if(runs.length) h+=`<h2>Protocolos de quimioterapia</h2><ul>${runs.map(r=>`<li>${e(r.protocolName)} — início ${fmtDateBR(r.startDate)} — ${e((RUN_STATUS[r.status]||{}).t||r.status)}${r.suspendedDate?' (suspenso em '+fmtDateBR(r.suspendedDate)+(r.suspendReason?': '+e(r.suspendReason):'')+')':''}</li>`).join('')}</ul>`;
  h+='<h2>Sessões</h2>'+(sess.length?'':'<p>Nenhuma sessão registrada.</p>');
  sess.forEach(x=>{
    const when=x.executedAt?'aplicada em '+fmtDT(x.executedAt):'prevista para '+fmtDateBR(x.plannedDate);
    h+=`<h3>#${x.order} ${e(x.stepLabel||'')}${x.protocolName?' ['+e(x.protocolName)+']':''} — ${e((SESS_STATUS[x.status]||{}).t||x.status)} — ${e(when)}</h3><ul>`;
    if(x.weight) h+=`<li>Peso ${x.weight} kg${x.bsa?' · SC '+x.bsa.toFixed(3)+' m²':''}</li>`;
    (x.drugs||[]).filter(d=>d&&d.name).forEach(d=>{ h+=`<li><b>${e(d.name)}</b>: ${d.doseMg!=null&&d.doseMg!==''?d.doseMg+' mg':e(d.dose||'')}${d.volumeMl?' · '+d.volumeMl+' mL':''}${d.adjustPct&&d.adjustPct!==100?' · ajuste '+d.adjustPct+'%':''}${d.via?' · '+e(d.via):''}</li>`; });
    if(x.responseStatus) h+=`<li>Resposta: ${e((RESPONSE_LABEL[x.responseStatus]||{}).t||x.responseStatus)}${x.tumorMeasure!=null?' · tumor '+x.tumorMeasure+' cm':''}${x.responseNotes?' — '+e(x.responseNotes):''}</li>`;
    if(x.sideEffects) h+=`<li>Efeitos adversos: ${e(x.sideEffects)}</li>`;
    if(x.complementaryMed) h+=`<li>Medicina complementar: ${e(x.complementaryMed)}</li>`;
    if((x.exams||[]).length) h+=`<li>Exames: ${e(x.exams.map(z=>z.name+(z.done?' (feito)':'')).join(', '))}</li>`;
    if(x.notes) h+=`<li>Obs.: ${e(x.notes)}</li>`;
    h+='</ul>';
  });
  if(th.length) h+='<h2>Terapias oncológicas</h2>'+th.map(t=>`<p><b>${e(t.name)}</b> (${e(THERAPY_CATS[t.category]||'')}) — ${e([t.route,t.dose,t.frequency].filter(Boolean).join(' · '))}<br>Aplicações: ${e((t.applications||[]).map(a=>fmtDateBR(a.date)).join(', ')||'nenhuma')}</p>`).join('');
  if(ex.length) h+='<h2>Solicitações de exames emitidas</h2><ul>'+ex.map(r=>`<li>${fmtDateBR(r.issuedDate)} (válida até ${fmtDateBR(r.validUntil)}): ${e((r.exams||[]).join(', '))}</li>`).join('')+'</ul>';
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Histórico ${e(p.name)}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{font-size:18pt;color:#123129}h2{font-size:13pt;background:#e8f0ec;padding:3px 6px;margin-top:16pt}h3{font-size:11pt;margin:10pt 0 2pt}table{border-collapse:collapse}td{padding:2px 6px;vertical-align:top}ul{margin-top:2pt}</style></head><body>${h}</body></html>`;
}
async function exportHistoryWord(p){
  const dl = await getDownloader();
  if(!dl){ toast('Download indisponível neste ambiente'); return; }
  const slug=String(p.name||'paciente').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  try{ await dl.save({filename:`Historico_${slug}_${todayStr()}.doc`, data:new Blob(['\ufeff'+buildHistoryDoc(p)],{type:'application/msword'})}); toast('Arquivo Word salvo'); }
  catch(e){ if(!e||e.code!=='declined') toast('Não foi possível gerar: '+((e&&e.message)||'erro')); }
}
async function clearPatientHistory(p){
  const n=state.sessions.filter(x=>x.patientId===p.id).length, t=state.therapies.filter(x=>x.patientId===p.id).length, r=state.examRequests.filter(x=>x.patientId===p.id).length;
  if(!(await askConfirm(`Apagar o histórico detalhado de ${p.name} (${n} sessão(ões), ${t} terapia(s), ${r} solicitação(ões) de exame) e manter só a ficha arquivada? Exporte o PDF/Word antes. Não há como desfazer.`,'Apagar histórico'))) return;
  try{
    const jobs=[];
    state.sessions.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('sessions/'+x.id)));
    state.therapies.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('therapies/'+x.id)));
    state.examRequests.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('examRequests/'+x.id)));
    await Promise.all(jobs);
    await dbUpdate('patients/'+p.id,{runs:[], historyClearedAt:Date.now(), updatedAt:Date.now()});
    toast('Histórico detalhado apagado');
  }catch(e){ toast('Erro: '+e.message); }
}
async function toggleArchive(p){
  if(!p.archived && !(await askConfirm(`Arquivar ${p.name}? Ele sai da lista, do calendário e dos atrasos, mas o histórico é mantido e pode ser desarquivado.`,'Arquivar'))) return;
  try{ await dbUpdate('patients/'+p.id,{archived:!p.archived, archivedAt:p.archived?null:Date.now(), updatedAt:Date.now()}); toast(p.archived?'Paciente desarquivado':'Paciente arquivado'); if(!p.archived) go('pacientes'); }
  catch(e){ toast('Erro: '+e.message); }
}
async function deletePatientForever(p){
  if(!p.archived){ toast('Arquive o paciente antes de excluir'); return; }
  if(!(await askConfirm(`Excluir DEFINITIVAMENTE ${p.name} e todo o histórico (sessões, terapias, solicitações)? Não há como desfazer. Baixe o PDF do histórico antes, se precisar.`,'Excluir tudo'))) return;
  try{
    const jobs=[];
    state.sessions.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('sessions/'+x.id)));
    state.therapies.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('therapies/'+x.id)));
    state.examRequests.filter(x=>x.patientId===p.id).forEach(x=>jobs.push(dbDelete('examRequests/'+x.id)));
    await Promise.all(jobs); await dbDelete('patients/'+p.id);
    toast('Paciente e histórico excluídos'); go('pacientes');
  }catch(e){ toast('Erro ao excluir: '+e.message); }
}

   (sobrescreve initDb e getDownloader do código base)
   ========================================================================= */
const FBV = '10.12.2', FBBASE = 'https://www.gstatic.com/firebasejs/'+FBV+'/';
let FB = null;

async function getDownloader(){
  return { save: async ({filename, data})=>{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }};
}

function loginScreen(html){
  let r = document.getElementById('login-root');
  if(!r){ r = document.createElement('div'); r.id='login-root';
    r.style.cssText='position:fixed;inset:0;z-index:9999;background:var(--bg,#f4f7f5);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;';
    document.body.appendChild(r); }
  r.innerHTML = `<div class="card card-pad" style="max-width:440px;width:100%;text-align:center;">
    <div style="font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:.06em;margin-bottom:4px;">ONKOVET</div>
    <div class="faint" style="margin-bottom:18px;">Acompanhamento oncológico veterinário</div>${html}</div>`;
}
const hideLogin = ()=>{ const r=document.getElementById('login-root'); if(r) r.remove(); };
const setSync = (txt, off)=>{ const el=document.getElementById('sync-status'); if(el){ el.innerHTML='<span class="sdot"></span>'+txt; el.classList.toggle('offline', !!off); } };

async function initDb(){
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.apiKey || /COLE_AQUI/.test(cfg.apiKey)){
    loginScreen(`<p class="muted">O Firebase ainda não foi configurado. Abra o arquivo <b>firebase-config.js</b> e cole os dados do seu projeto (veja o passo a passo no LEIAME).</p>`);
    setSync('Não configurado', true); return;
  }
  try{
    const [appM, authM, fsM] = await Promise.all([import(FBBASE+'firebase-app.js'), import(FBBASE+'firebase-auth.js'), import(FBBASE+'firebase-firestore.js')]);
    const app = appM.initializeApp(cfg);
    const auth = authM.getAuth(app);
    FB = {app, auth, authM, fsM, db:null};
    authM.onAuthStateChanged(auth, user=>{ if(user) onSignedIn(user); else showSignIn(); });
  }catch(e){
    loginScreen(`<p class="muted">Não foi possível carregar o Firebase. Verifique a conexão com a internet.</p><p class="faint">${escapeHtml(e.message||'')}</p>`);
    setSync('Sem conexão', true);
  }
}
function showSignIn(){
  setSync('Desconectado', true);
  loginScreen(`<p class="muted" style="margin-bottom:16px;">Entre com a conta Google autorizada pela clínica.</p>
    <button class="btn btn-primary" id="btn-google" style="width:100%;">Entrar com Google</button><div id="login-err" class="faint mt8"></div>`);
  document.getElementById('btn-google').addEventListener('click', async ()=>{
    const {authM, auth} = FB; const prov = new authM.GoogleAuthProvider();
    try{ await authM.signInWithPopup(auth, prov); }
    catch(e){
      if(e && (e.code==='auth/popup-blocked' || e.code==='auth/operation-not-supported-in-this-environment')){ authM.signInWithRedirect(auth, prov); return; }
      if(e && e.code==='auth/popup-closed-by-user') return;
      document.getElementById('login-err').textContent = 'Erro ao entrar: '+(e.code||e.message);
    }
  });
}
async function onSignedIn(user){
  const {fsM, app, authM, auth} = FB;
  const email = (user.email||'').toLowerCase();
  const master = (window.MASTER_EMAILS||[]).map(x=>String(x).toLowerCase()).includes(email);
  if(!FB.db) FB.db = fsM.initializeFirestore(app, {ignoreUndefinedProperties:true, localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})});
  const db = FB.db;
  let allowed = master;
  if(!allowed){
    try{ const snap = await fsM.getDoc(fsM.doc(db,'users',email)); allowed = snap.exists(); }catch(e){ allowed = false; }
  }
  if(!allowed){
    loginScreen(`<p class="muted">A conta <b>${escapeHtml(email)}</b> não tem acesso ao ONKOVET.</p><p class="faint">Peça ao responsável (master) para incluir este e-mail na equipe.</p>
      <button class="btn mt14" id="btn-out">Sair</button>`);
    document.getElementById('btn-out').addEventListener('click', ()=>authM.signOut(auth));
    setSync('Sem acesso', true); return;
  }
  state.isMaster = master; state.userEmail = email;
  state.db = {
    collection: name=>({
      onSnapshot:(ok,err)=>fsM.onSnapshot(fsM.collection(db,name), s=>ok({docs:s.docs.map(d=>({id:d.id, data:()=>d.data()}))}), err),
      add: data=>fsM.addDoc(fsM.collection(db,name), data),
    }),
    doc: path=>{ const ref = fsM.doc(db, ...path.split('/')); return {
      onSnapshot:(ok,err)=>fsM.onSnapshot(ref, s=>ok({exists:s.exists(), data:()=>s.data()}), err),
      set: d=>fsM.setDoc(ref,d), update: d=>fsM.updateDoc(ref,d), delete: ()=>fsM.deleteDoc(ref),
    };},
  };
  state.dbReady = true;
  hideLogin();
  setSync((master?'Master · ':'')+escapeHtml(email), false);
  if(!state._subscribed){ state._subscribed = true; subscribeAll(); if(master) fsM.onSnapshot(fsM.collection(db,'users'), s=>{ state.team = s.docs.map(d=>d.id).sort(); }, ()=>{}); }
  render();
}

/* ---- equipe (somente master) ---- */
function teamHtml(){
  if(!canAdmin()) return `<hr class="hr"><button class="btn btn-sm" id="btn-signout">Sair da conta (${escapeHtml(state.userEmail||'')})</button>`;
  return `<hr class="hr"><div class="section-title">Equipe com acesso</div>
    <div class="faint" style="margin-bottom:8px;">Inclua o e-mail Google de cada pessoa que pode usar o sistema. A equipe vê e edita pacientes e sessões; só o master exporta histórico e apaga.</div>
    <div id="team-list">${(state.team||[]).map(m=>`<div class="run-row"><span>${escapeHtml(m)}</span><button class="btn btn-sm btn-danger" data-rm-member="${escapeHtml(m)}">Remover</button></div>`).join('')||'<div class="faint">Nenhum membro ainda.</div>'}</div>
    <div class="flex gap8 mt8"><input id="team-email" type="email" placeholder="email@gmail.com" style="flex:1;"><button class="btn btn-sm btn-primary" id="team-add">Adicionar</button></div>
    <hr class="hr"><button class="btn btn-sm" id="btn-signout">Sair da conta (${escapeHtml(state.userEmail||'')})</button>`;
}
function wireTeam(){
  const add=document.getElementById('team-add');
  if(add) add.addEventListener('click', async ()=>{
    const em=(document.getElementById('team-email').value||'').trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('E-mail inválido'); return; }
    try{ await dbSet('users/'+em, {role:'equipe', addedAt:Date.now()}); toast('Membro adicionado'); closeModal(); }catch(e){ toast('Erro: '+e.message); }
  });
  document.querySelectorAll('[data-rm-member]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!(await askConfirm('Remover o acesso de '+b.dataset.rmMember+'?','Remover'))) return;
    try{ await dbDelete('users/'+b.dataset.rmMember); toast('Acesso removido'); closeModal(); }catch(e){ toast('Erro: '+e.message); }
  }));
  const out=document.getElementById('btn-signout'); if(out) out.addEventListener('click', ()=>FB.authM.signOut(FB.auth));
}

/* =========================================================================
   INIT
   ========================================================================= */
(function init(){
  const h = location.hash.replace('#','');
  if(h.startsWith('paciente-')){ state.route='paciente'; state.routeParam=h.slice(9); }
  else if(h){ state.route=h; }
  render();
  initDb();
})();
</script>
